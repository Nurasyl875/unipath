 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UniPath — University Planning Platform</title>

<style>
:root{
  --bg:#f5f7fa;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --border:#e5e9ef;
  --text:#101828;
  --muted:#667085;
  --blue:#2563eb;
  --blue-dark:#1d4ed8;
  --blue-soft:#eff6ff;
  --green:#15803d;
  --green-soft:#ecfdf3;
  --orange:#b45309;
  --orange-soft:#fff7ed;
  --red:#b42318;
  --red-soft:#fef3f2;
  --shadow:0 8px 30px rgba(16,24,40,.06);
  --radius:16px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:248px;
  background:#fff;
  border-right:1px solid var(--border);
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  z-index:50;
  display:flex;
  flex-direction:column;
}

.brand{
  height:76px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:0 22px;
  border-bottom:1px solid var(--border);
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:9px;
  background:#111827;
  color:white;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:15px;
}

.brand-name{
  font-size:18px;
  font-weight:750;
  letter-spacing:-.4px;
}

.brand-name span{
  color:var(--blue);
}

.nav{
  padding:20px 12px;
  flex:1;
  overflow:auto;
}

.nav-section{
  color:#98a2b3;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
  font-weight:700;
  padding:0 11px 8px;
  margin-top:16px;
}

.nav-section:first-child{
  margin-top:0;
}

.nav-item{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  border:0;
  background:transparent;
  color:#475467;
  padding:10px 11px;
  border-radius:9px;
  margin-bottom:3px;
  text-align:left;
  font-size:13px;
  transition:.18s;
}

.nav-item:hover{
  background:#f7f8fa;
  color:#101828;
}

.nav-item.active{
  background:#eef4ff;
  color:#1d4ed8;
  font-weight:650;
}

.nav-icon{
  width:18px;
  height:18px;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:700;
  border:1px solid currentColor;
  border-radius:4px;
  opacity:.8;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding:14px;
}

.profile-mini{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#111827;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:12px;
  font-weight:700;
}

.profile-mini-text{
  min-width:0;
}

.profile-mini-name{
  font-size:12px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.profile-mini-sub{
  font-size:10px;
  color:var(--muted);
}

/* MAIN */

.main{
  margin-left:248px;
  width:calc(100% - 248px);
  min-height:100vh;
}

.topbar{
  height:76px;
  background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 30px;
  position:sticky;
  top:0;
  z-index:30;
  backdrop-filter:blur(12px);
}

.mobile-menu{
  display:none;
  border:1px solid var(--border);
  background:#fff;
  width:38px;
  height:38px;
  border-radius:9px;
}

.search{
  width:360px;
  height:40px;
  position:relative;
}

.search input{
  width:100%;
  height:100%;
  border:1px solid var(--border);
  border-radius:9px;
  padding:0 14px 0 38px;
  outline:none;
  background:#fff;
  color:var(--text);
  font-size:13px;
}

.search input:focus{
  border-color:#b7c7e8;
  box-shadow:0 0 0 3px #eef4ff;
}

.search-icon{
  position:absolute;
  left:14px;
  top:11px;
  color:#98a2b3;
  font-size:13px;
}

.topbar-right{
  display:flex;
  align-items:center;
  gap:16px;
}

.topbar-user{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:12px;
  font-weight:650;
}

.page{
  padding:30px;
  max-width:1500px;
  margin:auto;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:24px;
}

.page-title{
  font-size:27px;
  letter-spacing:-.7px;
  font-weight:750;
}

.page-subtitle{
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}

.btn{
  border:1px solid var(--border);
  background:#fff;
  color:#344054;
  border-radius:9px;
  padding:9px 14px;
  font-size:12px;
  font-weight:650;
  transition:.18s;
}

.btn:hover{
  border-color:#c8d0dc;
  background:#f9fafb;
}

.btn-primary{
  background:#111827;
  border-color:#111827;
  color:#fff;
}

.btn-primary:hover{
  background:#1f2937;
  border-color:#1f2937;
}

.btn-blue{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
}

.btn-blue:hover{
  background:var(--blue-dark);
}

.btn-danger{
  color:#b42318;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

/* DASHBOARD */

.hero{
  background:#111827;
  color:#fff;
  border-radius:18px;
  padding:32px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:30px;
  margin-bottom:22px;
}

.hero-copy{
  max-width:720px;
}

.hero-eyebrow{
  color:#a9c4ff;
  font-size:11px;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.1em;
  margin-bottom:10px;
}

.hero h1{
  font-size:32px;
  line-height:1.1;
  letter-spacing:-1.1px;
}

.hero p{
  color:#c5cbd5;
  margin-top:12px;
  line-height:1.6;
  font-size:13px;
  max-width:650px;
}

.hero-score{
  min-width:190px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;
  padding:20px;
}

.hero-score-label{
  color:#aeb6c3;
  font-size:11px;
}

.hero-score-value{
  font-size:38px;
  font-weight:800;
  margin:3px 0;
}

.hero-score-sub{
  color:#aeb6c3;
  font-size:11px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:22px;
}

.stat{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:19px;
}

.stat-label{
  color:var(--muted);
  font-size:11px;
  margin-bottom:8px;
}

.stat-value{
  font-size:24px;
  font-weight:750;
  letter-spacing:-.5px;
}

.stat-note{
  color:#98a2b3;
  font-size:10px;
  margin-top:5px;
}

.grid-2{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

.card-header{
  padding:19px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.card-title{
  font-size:14px;
  font-weight:720;
}

.card-subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.card-body{
  padding:20px;
}

/* PROGRESS */

.progress-row{
  margin-bottom:18px;
}

.progress-row:last-child{
  margin-bottom:0;
}

.progress-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:7px;
  font-size:11px;
}

.progress-top span:last-child{
  color:var(--muted);
}

.progress{
  height:7px;
  background:#edf0f4;
  border-radius:99px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:#2563eb;
  border-radius:99px;
}

/* UNIVERSITY CARDS */

.uni-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.uni-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  transition:.2s;
}

.uni-card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px rgba(16,24,40,.09);
  border-color:#d4dbe5;
}

.uni-cover{
  height:150px;
  position:relative;
  background:#e8edf4;
  overflow:hidden;
}

.uni-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.cover-overlay{
  position:absolute;
  inset:auto 0 0 0;
  height:55%;
  background:linear-gradient(transparent,rgba(0,0,0,.52));
}

.uni-initials{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  font-size:35px;
  font-weight:800;
  color:#667085;
  background:#eef2f6;
}

.save-btn{
  position:absolute;
  right:10px;
  top:10px;
  width:31px;
  height:31px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.92);
  color:#475467;
  font-size:15px;
  z-index:2;
}

.save-btn.saved{
  background:#111827;
  color:#fff;
}

.match-pill{
  position:absolute;
  left:11px;
  bottom:11px;
  z-index:2;
  background:#fff;
  color:#111827;
  border-radius:7px;
  padding:5px 8px;
  font-size:10px;
  font-weight:750;
}

.uni-content{
  padding:16px;
}

.uni-name{
  font-size:14px;
  font-weight:730;
  line-height:1.3;
}

.uni-location{
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
}

.uni-tags{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin:12px 0;
}

.tag{
  padding:4px 7px;
  background:#f5f7fa;
  color:#667085;
  border-radius:5px;
  font-size:9px;
  font-weight:650;
}

.uni-footer{
  border-top:1px solid var(--border);
  padding-top:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.uni-requirements{
  color:#667085;
  font-size:10px;
}

.view-link{
  color:#2563eb;
  font-size:10px;
  font-weight:700;
}

/* FILTERS */

.filters{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:14px;
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr;
  gap:10px;
  margin-bottom:18px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:10px;
  color:#667085;
  font-weight:650;
}

.field input,
.field select,
.field textarea{
  border:1px solid var(--border);
  border-radius:8px;
  min-height:39px;
  padding:8px 10px;
  outline:none;
  color:#101828;
  background:#fff;
  font-size:12px;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#a9bde7;
  box-shadow:0 0 0 3px #eff6ff;
}

/* LIST */

.list{
  display:flex;
  flex-direction:column;
}

.list-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.list-item:last-child{
  border-bottom:0;
}

.list-main{
  min-width:0;
}

.list-title{
  font-size:12px;
  font-weight:700;
}

.list-meta{
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}

.status{
  padding:5px 8px;
  border-radius:6px;
  font-size:9px;
  font-weight:700;
  white-space:nowrap;
}

.status.green{
  background:var(--green-soft);
  color:var(--green);
}

.status.orange{
  background:var(--orange-soft);
  color:var(--orange);
}

.status.red{
  background:var(--red-soft);
  color:var(--red);
}

/* PORTFOLIO */

.portfolio-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.portfolio-items{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.portfolio-item{
  border:1px solid var(--border);
  border-radius:11px;
  padding:14px;
  background:#fff;
}

.portfolio-item-title{
  font-size:12px;
  font-weight:720;
}

.portfolio-item-type{
  color:#2563eb;
  font-size:9px;
  text-transform:uppercase;
  font-weight:750;
  margin-bottom:7px;
  letter-spacing:.06em;
}

.portfolio-item-description{
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
  margin-top:6px;
}

.portfolio-item-actions{
  display:flex;
  gap:5px;
  margin-top:11px;
}

.small-btn{
  border:1px solid var(--border);
  background:#fff;
  padding:5px 7px;
  border-radius:6px;
  font-size:9px;
  color:#475467;
}

.readiness{
  display:flex;
  align-items:center;
  gap:22px;
}

.ring{
  width:118px;
  height:118px;
  border-radius:50%;
  background:conic-gradient(#2563eb var(--percent),#edf0f4 0);
  display:grid;
  place-items:center;
  position:relative;
  flex:none;
}

.ring::after{
  content:"";
  width:88px;
  height:88px;
  border-radius:50%;
  background:#fff;
  position:absolute;
}

.ring-value{
  position:relative;
  z-index:2;
  font-size:25px;
  font-weight:800;
}

.readiness-copy h3{
  font-size:16px;
}

.readiness-copy p{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  margin-top:6px;
}

/* TABLE */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:720px;
}

th,
td{
  padding:13px 12px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:11px;
}

th{
  color:#667085;
  font-weight:650;
  background:#fafbfc;
}

td{
  color:#344054;
}

td strong{
  color:#101828;
}

/* ROADMAP */

.timeline{
  position:relative;
  margin-left:10px;
}

.timeline::before{
  content:"";
  position:absolute;
  left:10px;
  top:8px;
  bottom:8px;
  width:1px;
  background:#dce2ea;
}

.timeline-item{
  position:relative;
  padding:0 0 25px 36px;
}

.timeline-dot{
  position:absolute;
  left:4px;
  top:3px;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff;
  border:3px solid #2563eb;
}

.timeline-year{
  font-size:10px;
  color:#2563eb;
  font-weight:750;
  text-transform:uppercase;
}

.timeline-title{
  font-size:14px;
  font-weight:720;
  margin-top:4px;
}

.timeline-list{
  margin-top:8px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.timeline-list div{
  color:#667085;
  font-size:11px;
}

/* AI */

.ai-layout{
  display:grid;
  grid-template-columns:280px 1fr;
  gap:18px;
}

.ai-sidebar{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  padding:18px;
}

.ai-sidebar h3{
  font-size:14px;
  margin-bottom:8px;
}

.ai-sidebar p{
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}

.ai-suggestion{
  margin-top:14px;
  border:1px solid var(--border);
  background:#fafbfc;
  border-radius:9px;
  padding:10px;
  font-size:10px;
  color:#475467;
  cursor:pointer;
}

.ai-suggestion:hover{
  background:#f1f5f9;
}

.ai-chat{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  min-height:560px;
  display:flex;
  flex-direction:column;
}

.chat-messages{
  flex:1;
  padding:20px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.message{
  max-width:78%;
  padding:12px 14px;
  border-radius:11px;
  font-size:11px;
  line-height:1.6;
}

.message.ai{
  align-self:flex-start;
  background:#f5f7fa;
  color:#344054;
}

.message.user{
  align-self:flex-end;
  background:#111827;
  color:#fff;
}

.chat-input{
  padding:13px;
  border-top:1px solid var(--border);
  display:flex;
  gap:8px;
}

.chat-input input{
  flex:1;
  border:1px solid var(--border);
  border-radius:8px;
  padding:10px;
  outline:none;
  font-size:11px;
}

/* MODAL */

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.48);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-backdrop.open{
  display:flex;
}

.modal{
  width:min(980px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  box-shadow:0 25px 70px rgba(0,0,0,.22);
}

.modal-cover{
  height:250px;
  position:relative;
  background:#e9eef5;
}

.modal-cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.modal-close{
  position:absolute;
  right:14px;
  top:14px;
  width:35px;
  height:35px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.92);
  font-size:17px;
}

.modal-cover-info{
  position:absolute;
  left:24px;
  bottom:22px;
  color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.45);
}

.modal-cover-info h2{
  font-size:26px;
}

.modal-cover-info p{
  margin-top:4px;
  font-size:12px;
}

.modal-content{
  padding:24px;
}

.modal-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.detail-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
}

.detail-title{
  font-size:12px;
  font-weight:730;
  margin-bottom:12px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:8px 0;
  border-bottom:1px solid #f0f2f5;
  font-size:11px;
}

.detail-row:last-child{
  border-bottom:0;
}

.detail-row span:first-child{
  color:#667085;
}

.detail-row span:last-child{
  font-weight:650;
  text-align:right;
}

.modal-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:18px;
}

/* PROFILE */

.profile-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.form-full{
  grid-column:1/-1;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:50px 20px;
  color:#98a2b3;
}

.empty h3{

const universityImages = {};

async function loadUniversityImages(){

  const batchSize = 8;

  for(let i=0;i<universities.length;i+=batchSize){

    const batch = universities.slice(i,i+batchSize);

    await Promise.all(
      batch.map(async u=>{

        try{

          const query = encodeURIComponent(
            `${u.name} university campus`
          );

          const url =
            `https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=${query}&gsrnamespace=0&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json&origin=*`;

          const response = await fetch(url);

          if(!response.ok) return;

          const data = await response.json();

          const pages = data.query?.pages || {};
          const page = Object.values(pages)[0];

          if(page?.thumbnail?.source){
            universityImages[u.id] =
              page.thumbnail.source;
          }

        }catch(error){
          console.log("Image unavailable:",u.name);
        }

      })
    );

    if(currentPage==="overview"){
      renderCurrentPage();
    }
  }
}

function saveState(){

    STORAGE.profile,
    JSON.stringify(profile)
  );

  localStorage.setItem(
    STORAGE.saved,
    JSON.stringify(saved)
  );

  localStorage.setItem(
    STORAGE.portfolio,
    JSON.stringify(portfolio)
  );

  localStorage.setItem(
    STORAGE.tracker,
    JSON.stringify(tracker)
  );
}

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function toast(message){

  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

function initials(name){

  return name
    .split(" ")
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();
}

function portfolioScore(){

  let score = 0;

  if(portfolio.some(x=>x.type==="Project")) score += 35;
  if(portfolio.some(x=>x.type==="Certificate")) score += 15;
  if(portfolio.some(x=>x.type==="Competition")) score += 20;
  if(portfolio.some(x=>x.type==="Experience")) score += 20;
  if(portfolio.length >= 5) score += 10;

  return Math.min(score,100);
}

function calculateMatch(u){

  let score = 0;

  const sat = Number(profile.sat) || 0;
  const ielts = Number(profile.ielts) || 0;
  const gpa = Number(profile.gpa) || 0;

  /* SAT */

  if(sat >= u.sat) score += 25;
  else if(sat >= u.sat - 50) score += 19;
  else if(sat >= u.sat - 100) score += 12;
  else score += 6;

  /* IELTS */

  if(ielts >= u.ielts) score += 20;
  else if(ielts >= u.ielts - .5) score += 14;
  else score += 7;

  /* GPA */

  if(gpa >= u.gpa) score += 20;
  else if(gpa >= u.gpa - .3) score += 14;
  else if(gpa >= u.gpa - .6) score += 8;
  else score += 4;

  /* FIELD */

  if(
    profile.specialty.toLowerCase()
    === u.field.toLowerCase()
  ){
    score += 20;
  }else{
    score += 10;
  }

  /* DESTINATION */

  if(
    u.country.toLowerCase()
    === profile.destination.toLowerCase()
  ){
    score += 15;
  }else{
    score += 8;
  }

  return Math.min(99,Math.round(score));
}

function readinessScore(){

  const academic =
    Math.min(
      100,
      ((Number(profile.gpa)||0)/4.5)*100
    );

  const english =
    Math.min(
      100,
      ((Number(profile.ielts)||0)/8)*100
    );

  const sat =
    Math.min(
      100,
      ((Number(profile.sat)||0)/1600)*100
    );

  const portfolioPart = portfolioScore();

  return Math.round(
    academic*.30 +
    english*.20 +
    sat*.30 +
    portfolioPart*.20
  );
}

function category(match){

  if(match >= 82) return "Strong Target";
  if(match >= 68) return "Target";
  return "Reach";
}

function universityCard(u){

  const match = calculateMatch(u);
  const isSaved = saved.includes(u.id);

function renderUniversityGrid(){

  const grid =
    document.getElementById("universityGrid");

  if(!grid) return;

  const search =
    (document.getElementById("uniSearch")?.value || "")
    .toLowerCase();

  const country =
    document.getElementById("countryFilter")?.value || "";

  const field =
    document.getElementById("fieldFilter")?.value || "";

  const sort =
    document.getElementById("sortFilter")?.value || "match";

  let list = universities.filter(u=>{

    const matchesSearch =
      !search ||
      `${u.name} ${u.city} ${u.country} ${u.field}`
        .toLowerCase()
        .includes(search);

    const matchesCountry =
      !country || u.country===country;

    const matchesField =
      !field || u.field===field;

    return matchesSearch &&
           matchesCountry &&
           matchesField;

  });

  if(sort==="name"){
    list.sort((a,b)=>a.name.localeCompare(b.name));
  }

  if(sort==="sat"){
    list.sort((a,b)=>a.sat-b.sat);
  }

  if(sort==="match"){
    list.sort(
      (a,b)=>calculateMatch(b)-calculateMatch(a)
    );
  }

  grid.innerHTML =
    list.length
    ?
    list.map(universityCard).join("")
    :
    `
      <div class="empty" style="grid-column:1/-1">
        <h3>No universities found</h3>
        <p>Try changing your search or filters.</p>
      </div>
    `;
}

function addTrackerItem(){

  const university =
    prompt("University name:");

  if(!university) return;

  const deadline =
    prompt("Deadline:");

  tracker.push({
    university,
    deadline:deadline || "TBD",
    status:"Research",
    progress:10
  });

  saveState();
  renderCurrentPage();

  toast("Application added.");
}

function advanceTracker(index){

  const item = tracker[index];

  item.progress =
    Math.min(100,item.progress+20);

  if(item.progress>=100){
    item.status="Submitted";
  }else if(item.progress>=60){
    item.status="Preparing";
  }else{
    item.status="Research";
  }

  saveState();
  renderCurrentPage();
}

function removeTracker(index){

  tracker.splice(index,1);

  saveState();
  renderCurrentPage();

  toast("Application removed.");
}

            <div>Submit applications.</div>
            <div>Track deadlines.</div>
            <div>Complete interviews when required.</div>
            <div>Review offers and financial aid packages.</div>
          </div>

        </div>

      </div>

    </div>

  </div>

  `;
}

/* =========================================================

   ========================================================= */

function requirementRow(label,current,target){

  return `

        <div class="list-meta">

}

function checkItem(label,checked){

  return `

      <div class="list-title">${label}</div>

      <span class="status ${checked?"green":"orange"}">

      </span>

    </div>

}

/* =========================================================
   PORTFOLIO
   ========================================================= */

function renderPortfolio(){

  const score = portfolioScore();

  return `

  <div class="page-header">

    <div>
      <div class="page-title">Portfolio</div>
      <div class="page-subtitle">
        Build and organize the profile you will eventually present
        to universities.
      </div>
    </div>

    <button
      class="btn btn-primary"
      onclick="openPortfolioForm()"
    >
      Add item
    </button>

  </div>

  <div class="portfolio-grid">

    <div class="card">

      <div class="card-header">

        <div>
          <div class="card-title">
            Portfolio strength
          </div>

          <div class="card-subtitle">
            Based on the breadth of your current activities
          </div>
        </div>

      </div>

      <div class="card-body">

        <div class="readiness">

          <div
            class="ring"
            style="--percent:${score}%"
          >
            <div class="ring-value">
              ${score}%
            </div>
          </div>

          <div class="readiness-copy">

            <h3>
              ${
                score>=80
                ?"Strong foundation"
                :
                score>=50
                ?"Good foundation"
                :
                "Early stage"
              }
            </h3>

            <p>
              Add meaningful projects, competitions,
              certificates and experience over time.
              Quality matters more than simply collecting items.
            </p>

          </div>

        </div>

      </div>

    </div>

    <div class="card">

      <div class="card-header">

        <div>
          <div class="card-title">
            Portfolio categories
          </div>

          <div class="card-subtitle">
            Your current profile
          </div>
        </div>

      </div>

      <div class="card-body">

        ${progressRow(
          "Projects",
          Math.min(
            100,
            portfolio.filter(x=>x.type==="Project").length*35
          )
        )}

        ${progressRow(
          "Certificates",
          Math.min(
            100,
            portfolio.filter(x=>x.type==="Certificate").length*25
          )
        )}

        ${progressRow(
          "Competitions",
          Math.min(
            100,
            portfolio.filter(x=>x.type==="Competition").length*30
          )
        )}

        ${progressRow(
          "Experience",
          Math.min(
            100,
            portfolio.filter(x=>x.type==="Experience").length*30
          )
        )}

      </div>

    </div>

  </div>

  <div style="height:20px"></div>

  <div class="card">

    <div class="card-header">

      <div>
        <div class="card-title">
          Your activities
        </div>

        <div class="card-subtitle">
          Projects and achievements saved to your profile
        </div>
      </div>

      <button
        class="btn"
        onclick="openPortfolioForm()"
      >
        Add
      </button>

    </div>

    <div class="card-body">

      ${
        portfolio.length
        ?
        `<div class="portfolio-items">
          ${portfolio.map(portfolioCard).join("")}
        </div>`
        :
        `
          <div class="empty">
            <h3>Your portfolio is empty</h3>
            <p>Add your first project or achievement.</p>
          </div>
        `
      }

    </div>

  </div>

  `;
}

function portfolioCard(item){

  return `

  <div class="portfolio-item">

    <div class="portfolio-item-type">
      ${escapeHTML(item.type)}
    </div>

    <div class="portfolio-item-title">
      ${escapeHTML(item.title)}
    </div>

    <div class="portfolio-item-description">
      ${escapeHTML(item.description)}
    </div>

    <div
      style="
        color:#98a2b3;
        font-size:9px;
        margin-top:8px;
      "
    >
      ${escapeHTML(item.year)}
    </div>

    <div class="portfolio-item-actions">

      <button
        class="small-btn"
        onclick="removePortfolio(${item.id})"
      >
        Remove
      </button>

    </div>

  </div>

  `;
}

function openPortfolioForm(){

  const type =
    prompt(
      "Type: Project, Certificate, Competition or Experience"
    );

  if(!type) return;

  const title =
    prompt("Title:");

  if(!title) return;

  const description =
    prompt("Short description:");

  const year =
    prompt("Year:","2026");

  portfolio.push({
    id:Date.now(),
    type,
    title,
    description:description || "",
    year:year || "2026"
  });

  saveState();
  renderCurrentPage();

  toast("Portfolio item added.");
}

function removePortfolio(id){

  portfolio =
    portfolio.filter(item=>item.id!==id);

  saveState();
  renderCurrentPage();

  toast("Portfolio item removed.");
}

/* =========================================================
   PROFILE
   ========================================================= */

  <div class="page-header">

      <div class="page-subtitle">
        Your information is stored locally in this browser.

    </div>

    <button

    >

    </button>

  </div>

  <div class="profile-grid">

          <div class="card-subtitle">

      <div class="card-body">

        <div class="readiness">

          >
            <div class="ring-value">

            </div>
          </div>

          <div class="readiness-copy">

function saveProfile(){

  profile = {

    name:
      document.getElementById("profileName").value,

    grade:
      document.getElementById("profileGrade").value,

    specialty:
      document.getElementById("profileSpecialty").value,

    destination:
      document.getElementById("profileDestination").value,

    sat:
      Number(
        document.getElementById("profileSAT").value
      ),

    ielts:
      Number(
        document.getElementById("profileIELTS").value
      ),

    gpa:
      Number(
        document.getElementById("profileGPA").value
      )

  };

  saveState();
  updateHeader();

  renderCurrentPage();

  toast("Profile saved.");
}

function updateHeader(){

  const name =
    profile.name || "Student";

  document.getElementById("sidebarName")
    .textContent=name;

  document.getElementById("topName")
    .textContent=name;

  const letter =
    initials(name);

  document.getElementById("sidebarAvatar")
    .textContent=letter;

  document.getElementById("topAvatar")
    .textContent=letter;
}

/* =========================================================
   AI ASSISTANT
   ========================================================= */

function renderAssistant(){

  return `

  <div class="page-header">

    <div>
      <div class="page-title">AI Assistant</div>

      <div class="page-subtitle">
        Ask questions about your university planning.
      </div>
    </div>

  </div>

  <div class="ai-layout">

    <aside class="ai-sidebar">

      <h3>UniPath Assistant</h3>

      <p>
        Use the assistant to explore universities,
        understand your profile and plan your next steps.
      </p>

      <div
        class="ai-suggestion"
        onclick="useAISuggestion('What should I focus on in Grade 9?')"
      >
        What should I focus on in Grade 9?
      </div>

      <div
        class="ai-suggestion"
        onclick="useAISuggestion('Which universities match my current profile?')"
      >
        Which universities match my current profile?
      </div>

      <div
        class="ai-suggestion"
        onclick="useAISuggestion('How can I improve my portfolio?')"
      >
        How can I improve my portfolio?
      </div>

      <div
        class="ai-suggestion"
        onclick="useAISuggestion('What SAT score should I target?')"
      >
        What SAT score should I target?
      </div>

    </aside>

    <section class="ai-chat">

      <div
        class="chat-messages"
        id="chatMessages"
      >

        <div class="message ai">
          Hello, ${escapeHTML(profile.name)}.
          I can help you plan your university path,
          analyze your profile and explore the UniPath catalog.
        </div>

      </div>

      <div class="chat-input">

        <input
          id="aiInput"
          placeholder="Ask UniPath Assistant..."
        >

        <button
          class="btn btn-primary"
          onclick="sendAI()"
        >
          Send
        </button>

      </div>

    </section>

  </div>

  `;
}

/*
  This is a local assistant demo.
  It does not call an external AI API.
  A real LLM should be connected through
  a secure backend rather than exposing an API key.
*/

function sendAI(){

  const input =
    document.getElementById("aiInput");

  const text =
    input.value.trim();

  if(!text) return;

  addMessage(text,"user");

  input.value="";

  setTimeout(()=>{

    addMessage(
      generateAIResponse(text),
      "ai"
    );

  },300);

}

function useAISuggestion(text){

  const input =
    document.getElementById("aiInput");

  input.value=text;

  sendAI();
}

function addMessage(text,type){

  const box =
    document.getElementById("chatMessages");

  if(!box) return;

  const message =
    document.createElement("div");

  message.className=
    `message ${type}`;

  message.textContent=text;

  box.appendChild(message);

  box.scrollTop=box.scrollHeight;
}

function generateAIResponse(question){

  const q =
    question.toLowerCase();

  if(
    q.includes("grade 9") ||
    q.includes("9 class")
  ){

    return `
For Grade 9, focus on building the foundation:
strong school performance, English, mathematics,
programming fundamentals and meaningful projects.

Your goal should be consistency rather than trying
to complete an entire university application now.
    `.trim();

  }

  if(
    q.includes("portfolio") ||
    q.includes("project")
  ){

    return `
Your current portfolio has ${portfolio.length} item(s)
and a strength score of ${portfolioScore()}%.

For a CS applicant, focus on a few substantial projects
that demonstrate real technical work. Document what you
built, the technologies you used and what problem it solves.
    `.trim();

  }

  if(
    q.includes("sat")
  ){

    return `
Your current SAT target is ${profile.sat}.

For highly selective CS programs, a strong SAT score can
help, but it should be developed alongside grades,
English proficiency and your overall application.
    `.trim();

  }

  if(
    q.includes("university") ||
    q.includes("universities")
  ){

    const recommendations =
      [...universities]
      .sort((a,b)=>calculateMatch(b)-calculateMatch(a))
      .slice(0,3);

    return `
Based on your current profile, some of the higher-match
universities in your catalog are:

${recommendations.map(
  u=>`${u.name} — ${calculateMatch(u)}% match`
).join("\n")}

These are profile matches from the demo database,
not admission predictions.
    `.trim();

  }

  if(
    q.includes("ielts") ||
    q.includes("english")
  ){

    return `
Your current IELTS target is ${profile.ielts}.

A useful approach is to work on reading, listening,
writing and speaking consistently rather than focusing
only on vocabulary.
    `.trim();

  }

  return `
I can help you with your university profile,
SAT, IELTS, portfolio, roadmap and university search.

Try asking about a specific university or about
what you should improve next.
  `.trim();

}

/* =========================================================
   UNIVERSITY MODAL
   ========================================================= */

function openUniversity(id){

  const u =
    universities.find(x=>x.id===id);

  if(!u) return;

  currentUniversity=u;

  const image =
    universityImages[u.id];

  document.getElementById("modalImage").src =
    image || "";

  document.getElementById("modalName")
    .textContent=u.name;

  document.getElementById("modalLocation")
    .textContent=
      `${u.city} · ${u.country}`;

  document.getElementById("modalField")
    .textContent=u.field;

  document.getElementById("modalType")
    .textContent=u.type;

  document.getElementById("modalMatch")
    .textContent=
      calculateMatch(u)+"%";

  document.getElementById("modalTuition")
    .textContent=u.tuition;

  document.getElementById("modalSAT")
    .textContent=u.sat+"+";

  document.getElementById("modalIELTS")
    .textContent=u.ielts+"+";

  document.getElementById("modalGPA")
    .textContent=u.gpa;

  document.getElementById("modalPortfolio")
    .textContent=u.portfolio;

  document.getElementById("modalScholarship")
    .textContent=u.scholarship;

  document.getElementById("modalAid")
    .textContent=u.aid;

  document.getElementById("modalApplication")
    .textContent=u.application;

  document.getElementById("profileSATCheck")
    .textContent=
      profile.sat>=u.sat
      ?"Meets target"
      :"Below target";

  document.getElementById("profileIELTSCheck")
    .textContent=
      profile.ielts>=u.ielts
      ?"Meets target"
      :"Below target";

  document.getElementById("profileGPACheck")
    .textContent=
      profile.gpa>=u.gpa
      ?"Meets target"
      :"Below target";

  document.getElementById("profilePortfolioCheck")
    .textContent=
      portfolioScore()>=60
      ?"Developed"
      :"Needs development";

  updateModalButtons();

  document
    .getElementById("modalBackdrop")
    .classList.add("open");
}

function updateModalButtons(){

  if(!currentUniversity) return;

  const saveBtn =
    document.getElementById("modalSaveBtn");

  saveBtn.textContent =
    saved.includes(currentUniversity.id)
    ?"Remove from Saved"
    :"Save University";

}

function closeModal(){

  document
    .getElementById("modalBackdrop")
    .classList.remove("open");

  currentUniversity=null;
}

document
  .getElementById("modalClose")
  .addEventListener("click",closeModal);

document
  .getElementById("modalBackdrop")
  .addEventListener("click",e=>{

    if(e.target.id==="modalBackdrop"){
      closeModal();
    }

  });

document
  .getElementById("modalSaveBtn")
  .addEventListener("click",()=>{

    if(!currentUniversity) return;

    toggleSave(currentUniversity.id);

    updateModalButtons();

  });

document
  .getElementById("modalCompareBtn")
  .addEventListener("click",()=>{

    if(!currentUniversity) return;

    if(!saved.includes(currentUniversity.id)){
      saved.push(currentUniversity.id);
      saveState();
    }

    closeModal();

    showPage("compare");

  });

document
  .getElementById("modalWebsiteBtn")
  .addEventListener("click",()=>{

    if(!currentUniversity) return;

    window.open(
      currentUniversity.website,
      "_blank"
    );

  });

/* =========================================================
   SAVING
   ========================================================= */

function toggleSave(id){

  if(saved.includes(id)){

    saved =
      saved.filter(x=>x!==id);

    toast("Removed from saved.");

  }else{

    saved.push(id);

    toast("Saved.");

  }

  saveState();

  renderCurrentPage();

  if(currentUniversity?.id===id){
    updateModalButtons();
  }
}

/* =========================================================
   GLOBAL SEARCH
   ========================================================= */

document
  .getElementById("globalSearch")
  .addEventListener("keydown",e=>{

    if(e.key!=="Enter") return;

    const query =
      e.target.value.trim();

    if(!query) return;

    showPage("universities");

    setTimeout(()=>{

      const input =
        document.getElementById("uniSearch");

      if(input){

        input.value=query;

        renderUniversityGrid();

      }

    },30);

  });

/* =========================================================
   DYNAMIC EVENTS
   ========================================================= */

function bindDynamicEvents(){

  if(currentPage==="universities"){

    [
      "uniSearch",
      "countryFilter",
      "fieldFilter",
      "sortFilter"
    ].forEach(id=>{

      const element =
        document.getElementById(id);

      if(element){

        element.addEventListener(
          "input",
          renderUniversityGrid
        );

        element.addEventListener(
          "change",
          renderUniversityGrid
        );

      }

    });

    renderUniversityGrid();

  }

}

/* =========================================================
   MOBILE
   ========================================================= */

document
  .getElementById("mobileMenu")
  .addEventListener("click",()=>{

    document
      .getElementById("sidebar")
      .classList.toggle("open");

  });

/* =========================================================
   INITIALIZE
   ========================================================= */

updateHeader();

renderCurrentPage();

loadUniversityImages();

</script>
